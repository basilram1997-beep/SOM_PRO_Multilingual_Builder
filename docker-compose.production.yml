services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-som}
      POSTGRES_USER: ${POSTGRES_USER:-som_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - sompro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    command:
      [
        "sh",
        "-c",
        'redis-server /usr/local/etc/redis/redis.production.conf --requirepass "$${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}"'
      ]
    volumes:
      - sompro_redis_data:/data
      - ./deploy/redis/redis.production.conf:/usr/local/etc/redis/redis.production.conf:ro
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep PONG']
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.production
    restart: unless-stopped
    env_file:
      - apps/backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  license-server:
    build:
      context: .
      dockerfile: apps/license-server/Dockerfile.production
    restart: unless-stopped
    env_file:
      - apps/license-server/.env.production
    volumes:
      - sompro_license_data:/app/apps/license-server/data
    expose:
      - "4100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      license-server:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/sompro.conf:/etc/nginx/conf.d/default.conf:ro
      - sompro_certbot_www:/var/www/certbot
      - sompro_letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 10

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    ports:
      - "80:80"
    volumes:
      - sompro_letsencrypt:/etc/letsencrypt
      - sompro_certbot_www:/var/www/certbot
    entrypoint:
      [
        "sh",
        "-c",
        "if [ -n \"$${CERTBOT_EMAIL}\" ]; then certbot certonly --standalone --non-interactive --agree-tos --cert-name sompro --email \"$${CERTBOT_EMAIL}\" -d \"$${APP_DOMAIN:?set APP_DOMAIN}\"; else certbot certonly --standalone --non-interactive --agree-tos --cert-name sompro --register-unsafely-without-email -d \"$${APP_DOMAIN:?set APP_DOMAIN}\"; fi"
      ]

volumes:
  sompro_pg_data:
  sompro_redis_data:
  sompro_license_data:
  sompro_certbot_www:
  sompro_letsencrypt:
