name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency scan
        run: npm run security:deps

      - name: SAST
        run: npm run security:sast

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Contract and E2E tests
        run: npm run test:all

      - name: Desktop checks
        run: npm run desktop:check

      - name: Desktop SaaS checks
        run: npm run desktop:check:saas

      - name: Production check
        run: npm run production:check

      - name: Release readiness check
        run: npm run release:check

      - name: Security audit
        run: npm run security:deps

      - name: Full check
        run: npm run check

  browser_smoke:
    needs: validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://som_user:som_password@127.0.0.1:5432/som?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SOM_E2E_POSTGRES_HOST: 127.0.0.1
      SOM_E2E_POSTGRES_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:e2e:browser:smoke
