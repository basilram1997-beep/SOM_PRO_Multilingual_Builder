name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: som-pro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: "22"
  DATABASE_URL: postgresql://som_user:som_password@127.0.0.1:5432/som?schema=public
  REDIS_URL: redis://127.0.0.1:6379
  SOM_E2E_POSTGRES_HOST: 127.0.0.1
  SOM_E2E_POSTGRES_PORT: "5432"
  SOM_E2E_REDIS_PORT: "6379"
  SOM_E2E_TIMEOUT_MS: "180000"

jobs:
  quick_check:
    name: Quick Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and format check
        run: npm run check:quick

  compatibility_matrix:
    name: Compatibility Matrix (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: quick_check
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run compatibility matrix
        env:
          COMPATIBILITY_PLAYWRIGHT_PROJECTS: ${{ matrix.browser }}
          COMPATIBILITY_VIEWPORTS: desktop,tablet,mobile
        run: npm run compatibility:test

      - name: Upload compatibility artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-artifacts-${{ matrix.browser }}
          path: |
            tests/e2e/artifacts/
          if-no-files-found: ignore

  unit_tests:
    name: Unit And Integration Tests
    runs-on: ubuntu-latest
    needs: quick_check
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy -w apps/backend

      - name: Run test suites
        run: npm run test

  install_doctor:
    name: Install Doctor
    runs-on: ubuntu-latest
    needs: quick_check
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run install doctor
        run: npm run install:doctor

  security_baseline:
    name: Security Baseline
    runs-on: ubuntu-latest
    needs: quick_check
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security baseline
        run: npm run security:baseline

  browser_smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: quick_check
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run core browser smoke
        run: npm run test:e2e:browser:smoke:core

      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  usability_smoke:
    name: Usability Smoke
    runs-on: ubuntu-latest
    needs: quick_check
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run usability smoke
        run: npm run test:e2e:browser:usability

      - name: Upload usability artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usability-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  performance_smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    needs: quick_check
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run reports stress smoke
        env:
          STRESS_RUN_ID: ci-reports-${{ github.run_id }}
          STRESS_SCENARIO: reports
          STRESS_REQUESTS: "6"
          STRESS_CONCURRENCY: "2"
          STRESS_LOGIN_USERS: "4"
          STRESS_LOGIN_CONCURRENCY: "2"
          PERF_RUN_ID: ci-reports-${{ github.run_id }}
        run: npm run stress:reports

      - name: Run attendance stress smoke
        env:
          STRESS_RUN_ID: ci-attendance-${{ github.run_id }}
          STRESS_SCENARIO: attendance
          STRESS_REQUESTS: "6"
          STRESS_CONCURRENCY: "2"
          STRESS_LOGIN_USERS: "4"
          STRESS_LOGIN_CONCURRENCY: "2"
          PERF_RUN_ID: ci-attendance-${{ github.run_id }}
        run: npm run stress:attendance

  release_doctor:
    name: Release Doctor
    runs-on: ubuntu-latest
    needs:
      - quick_check
      - compatibility_matrix
      - unit_tests
      - browser_smoke
      - usability_smoke
      - install_doctor
      - security_baseline
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SOM_E2E_TIMEOUT_MS: "240000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release doctor
        run: npm run release:doctor -- --skip-baseline

      - name: Upload release artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-doctor-artifacts
          path: |
            test-results/
            playwright-report/
            logs/
          if-no-files-found: ignore
