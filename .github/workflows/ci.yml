name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: som-pro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick_check:
    name: Quick Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quick checks
        run: npm run check:quick

  release_doctor:
    name: Release Doctor
    needs: quick_check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: som
          POSTGRES_USER: som_user
          POSTGRES_PASSWORD: som_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U som_user -d som"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: true
      DATABASE_URL: postgresql://som_user:som_password@127.0.0.1:5432/som?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SOM_E2E_POSTGRES_HOST: 127.0.0.1
      SOM_E2E_POSTGRES_PORT: 5432
      SOM_E2E_REDIS_PORT: 6379
      SOM_E2E_TIMEOUT_MS: 120000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release doctor
        run: npm run release:doctor
