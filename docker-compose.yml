services:
  postgres:
    image: postgres:16-alpine
    container_name: sompro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: som
      POSTGRES_USER: som_user
      POSTGRES_PASSWORD: som_password
    ports:
      - "5432:5432"
    volumes:
      - sompro_pg_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: sompro_redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  sompro_pg_data:
