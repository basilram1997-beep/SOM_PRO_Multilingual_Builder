<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOM PRO</title>
    <style>
      body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        background: #f6f7fb;
        color: #0f172a;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        width: min(620px, 88vw);
        background: white;
        border: 1px solid #d9dee8;
        border-radius: 24px;
        padding: 42px 34px;
        box-shadow: 0 22px 70px #0001;
        text-align: center;
      }
      .logo {
        width: 104px;
        height: 104px;
        border-radius: 24px;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 42px;
        margin: 12px 0 8px;
        letter-spacing: 0;
      }
      .tag {
        color: #2563eb;
        font-weight: 900;
      }
      .spinner {
        width: 46px;
        height: 46px;
        border: 5px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        margin: 22px auto;
        animation: spin 1s linear infinite;
      }
      p {
        color: #64748b;
        font-weight: 800;
        line-height: 1.8;
      }
      .late {
        display: none;
        margin-top: 14px;
        background: #f8fafc;
        border: 1px solid #dbe3ef;
        border-radius: 14px;
        padding: 12px;
        font-size: 14px;
        line-height: 1.9;
      }
      button {
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-weight: 900;
        padding: 10px 16px;
        cursor: pointer;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="icon.ico" alt="SOM PRO" />
      <h1>SOM <span class="tag">PRO</span></h1>
      <div class="spinner"></div>
      <p>
        &#1580;&#1575;&#1585;&#1610; &#1578;&#1588;&#1594;&#1610;&#1604; &#1582;&#1583;&#1605;&#1575;&#1578; SOM PRO
        &#1575;&#1604;&#1605;&#1581;&#1604;&#1610;&#1577;...
      </p>
      <div id="late" class="late">
        &#1573;&#1584;&#1575; &#1575;&#1587;&#1578;&#1605;&#1585;
        &#1575;&#1604;&#1575;&#1606;&#1578;&#1592;&#1575;&#1585;&#1548; &#1575;&#1601;&#1578;&#1581;
        &#1605;&#1604;&#1601; <b dir="ltr">scripts/windows/DIAGNOSE_SOM_PRO_LOCAL_WINDOWS.cmd</b> &#1605;&#1606;
        &#1605;&#1580;&#1604;&#1583; &#1575;&#1604;&#1605;&#1588;&#1585;&#1608;&#1593; &#1571;&#1608;
        &#1575;&#1601;&#1581;&#1589; <b dir="ltr">logs/sompro-services.log</b>.
        <div style="margin-top: 10px">
          <button onclick="location.reload()">
            &#1573;&#1593;&#1575;&#1583;&#1577; &#1575;&#1604;&#1605;&#1581;&#1575;&#1608;&#1604;&#1577;
          </button>
        </div>
      </div>
    </main>
    <script>
      setTimeout(function () {
        document.getElementById("late").style.display = "block";
      }, 45000);
    </script>
  </body>
</html>
